<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THEnergy — Engenharia Solar Fotovoltaica em Portugal</title>
  <meta name="description" content="THEnergy: projeto e instalação de sistemas fotovoltaicos residenciais, industriais e agrícolas em Portugal. Site em construção." />
  <meta name="author" content="THEnergy" />

  <meta property="og:title" content="THEnergy — Engenharia em movimento" />
  <meta property="og:description" content="O sol quando nasce é para todos. Site em construção." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" type="image/png" href="favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --navy: #1b2a3d;
      --navy-deep: #0f1a28;
      --gold: #e8a33d;
      --gold-light: #f4c15b;
      --cream: #f6f1e6;
      --graphite: #4a5560;
      --sage: #7a8c6e;
      --font-display: "Archivo", system-ui, sans-serif;
      --font-sans: "Inter", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--cream);
      color: var(--navy);
      font-family: var(--font-sans);
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; margin: 0; padding: 0; }

    main {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }

    .bg-blueprint {
      position: absolute;
      inset: 0;
      background-image: url("blueprint-bg.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
    }
    .bg-wash {
      position: absolute;
      inset: 0;
      background: rgba(246, 241, 230, 0.7);
      pointer-events: none;
    }

    .wrap {
      position: relative;
      max-width: 64rem;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 2.5rem 1.5rem;
    }

    header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    header img {
      height: 3.5rem;
      width: auto;
    }
    .brand {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.5rem;
      letter-spacing: -0.01em;
    }
    .brand .the { color: var(--navy); }
    .brand .nergy { color: var(--gold); }

    section.hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3.5rem 0;
    }

    h1 {
      font-family: var(--font-display);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      line-height: 1.05;
      font-size: 2.2rem;
      margin: 0;
    }
    h1 .gold { color: var(--gold); }

    .lede {
      margin: 1.75rem 0 0;
      max-width: 36rem;
      color: var(--graphite);
      font-size: 1rem;
      line-height: 1.65;
    }

    nav.socials {
      margin-top: 2.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
    }
    nav.socials a {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      border: 1px solid rgba(27, 42, 61, 0.2);
      background: rgba(246, 241, 230, 0.7);
      border-radius: 999px;
      padding: 0.75rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--navy);
      backdrop-filter: blur(2px);
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    nav.socials a:hover {
      border-color: var(--gold);
      color: var(--gold);
    }
    nav.socials svg { width: 1.25rem; height: 1.25rem; flex: none; }

    form.signup {
      margin-top: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      max-width: 28rem;
    }
    @media (min-width: 640px) {
      form.signup { flex-direction: row; }
    }
    form.signup input {
      flex: 1;
      border-radius: 999px;
      border: 1px solid rgba(27, 42, 61, 0.2);
      background: rgba(246, 241, 230, 0.8);
      padding: 0.75rem 1.25rem;
      font-size: 0.875rem;
      color: var(--navy);
      outline: none;
      font-family: inherit;
    }
    form.signup input::placeholder { color: rgba(74, 85, 96, 0.7); }
    form.signup input:focus { border-color: var(--gold); }
    form.signup button {
      border: none;
      cursor: pointer;
      border-radius: 999px;
      background: var(--navy);
      color: var(--cream);
      padding: 0.75rem 1.5rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-family: inherit;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    form.signup button:hover {
      background: var(--gold);
      color: var(--navy-deep);
    }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .form-message {
      margin: 0.9rem 0 0;
      font-size: 0.875rem;
      min-height: 1.2em;
    }
    .form-message.success { color: var(--sage); }
    .form-message.error { color: #b64545; }

    section.services { padding-bottom: 1.5rem; text-align: center; }
    .services-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--graphite);
      margin: 0;
    }
    .services-grid {
      margin-top: 1.75rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
    }
    .services-grid li {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      border: 1px solid rgba(27, 42, 61, 0.2);
      background: rgba(246, 241, 230, 0.7);
      border-radius: 1.5rem;
      padding: 1rem 1.25rem;
      backdrop-filter: blur(2px);
    }
    .service-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
      color: var(--navy);
    }
    .service-icon svg { width: 1.5rem; height: 1.5rem; }
    .service-label {
      text-align: center;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--graphite);
    }
    .tagline {
      margin-top: 3rem;
      font-size: 0.875rem;
      font-style: italic;
      color: var(--graphite);
    }
    .service-sub {
      display: block;
    }

    @media (min-width: 640px) {
      header img { height: 4rem; }
      .brand { font-size: 1.875rem; }
      h1 { font-size: 3.75rem; }
      .lede { font-size: 1.125rem; }

      nav.socials { gap: 1rem; }
      nav.socials a { padding: 0.9rem 1.5rem; font-size: 1rem; gap: 0.75rem; }
      nav.socials svg { width: 1.5rem; height: 1.5rem; }

      form.signup input { font-size: 1rem; padding: 0.9rem 1.5rem; }
      form.signup button { font-size: 0.8rem; padding: 0.9rem 1.75rem; }

      .services-label { font-size: 0.8rem; }
      .services-grid { margin-top: 2.25rem; gap: 1rem; }
      .services-grid li { padding: 1.25rem 1.5rem; gap: 0.5rem; }
      .service-icon svg { width: 1.75rem; height: 1.75rem; }
      .service-label { font-size: 0.8rem; }

      .tagline { font-size: 1rem; }
    }
    @media (min-width: 1024px) {
      h1 { font-size: 4.5rem; }
    }

    :focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="bg-blueprint" aria-hidden="true"></div>
    <div class="bg-wash" aria-hidden="true"></div>

    <div class="wrap">
      <header>
        <img src="logo.png" alt="Logótipo THEnergy" width="270" height="260" />
        <span class="brand"><span class="the">THE</span><span class="nergy">nergy</span></span>
      </header>

      <section class="hero">
        <h1>
          Website<br />
          <span class="gold">Em construção.</span>
        </h1>

        <nav aria-label="Contactos" class="socials">
          <a href="https://instagram.com/thenergy.pt" target="_blank" rel="noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3.5" y="3.5" width="17" height="17" rx="5" />
              <circle cx="12" cy="12" r="4" />
              <circle cx="17" cy="7" r="1" fill="currentColor" />
            </svg>
            <span>Instagram</span>
          </a>
          <a href="https://www.facebook.com/profile.php?id=61591536192205" target="_blank" rel="noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3.5" y="3.5" width="17" height="17" rx="5" />
              <path d="M15.5 8h-1.6A1.9 1.9 0 0 0 12 9.9V12m-2 0h4.6M12 12v8" />
            </svg>
            <span>Facebook</span>
          </a>
          <a href="https://wa.me/351910827273" target="_blank" rel="noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3.75a8.25 8.25 0 0 0-7.1 12.45L3.9 20.1l3.99-1.02A8.25 8.25 0 1 0 12 3.75Z" />
              <path d="M9.3 8.4c.3-.05.55.02.7.35l.6 1.3c.1.24.06.45-.1.63l-.42.48c-.15.17-.18.36-.07.56.5.9 1.24 1.6 2.2 2.1.2.1.4.07.55-.1l.47-.5c.17-.18.38-.22.6-.12l1.3.6c.31.15.4.4.34.7-.16.9-.95 1.4-1.9 1.3-2.6-.28-4.9-2.55-5.2-5.14-.1-.94.4-1.7 1.3-1.86Z" />
            </svg>
            <span>WhatsApp</span>
          </a>
          <a href="mailto:geral@thenergy.pt">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5.5" width="18" height="13" rx="2.5" />
              <path d="m3.8 7.4 7.3 5.3c.54.4 1.26.4 1.8 0l7.3-5.3" />
            </svg>
            <span>E-mail</span>
          </a>
        </nav>

        <form id="contact-form" class="signup" action="https://formspree.io/f/SUBSTITUI_PELO_TEU_ID" method="POST">
          <label for="email" class="sr-only">O seu e-mail</label>
          <input id="email" name="email" type="email" required placeholder="O seu e-mail…" />
          <button type="submit">Quero ser contactado</button>
        </form>
        <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
      </section>

      <section class="services">
        <p class="services-label">Os nossos serviços</p>
        <ul class="services-grid">
          <li>
            <span class="service-icon">
              <svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 14.5 16 6l11 8.5V26a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1Z" />
                <path d="M12 27v-7h8v7M10.5 12.6h11" />
              </svg>
            </span>
            <span class="service-label">Residencial<br /><span class="service-sub">Industrial</span></span>
          </li>
          <li>
            <span class="service-icon">
              <svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 21h20l-2.5-9h-15Z" />
                <path d="M11 12 9.5 21M16 12v9M21 12l1.5 9M8.2 16.5h15.6M16 26v-5" />
              </svg>
            </span>
            <span class="service-label">Agrícola</span>
          </li>
          <li>
            <span class="service-icon">
              <svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                <rect x="6" y="6" width="12" height="20" rx="2.5" />
                <path d="M18 12h3.5a2 2 0 0 1 2 2v7a2 2 0 0 0 2 2 2 2 0 0 0 2-2v-8l-2.5-3" />
                <path d="m13 11-3 5h4l-2 5" />
              </svg>
            </span>
            <span class="service-label">Mobilidade</span>
          </li>
          <li>
            <span class="service-icon">
              <svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 5c3.5 4.4 5.5 7.4 5.5 10a5.5 5.5 0 1 1-11 0C10.5 12.4 12.5 9.4 16 5Z" />
                <path d="M6 24.5c2 0 2 1.5 4 1.5s2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5" />
              </svg>
            </span>
            <span class="service-label">Bombagem<br /><span class="service-sub">Solar</span></span>
          </li>
          <li>
            <span class="service-icon">
              <svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 26V14M11 26h10" />
                <path d="M8 10.5c2.6 0 4.4 1.3 5.5 3.5M24 10.5c-2.6 0-4.4 1.3-5.5 3.5" />
                <circle cx="16" cy="11" r="2.2" />
              </svg>
            </span>
            <span class="service-label">Rega<br /><span class="service-sub">Inteligente</span></span>
          </li>
          <li>
            <span class="service-icon">
              <svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="6" width="22" height="17" rx="2.5" />
                <path d="M9.5 18.5 14 13l3.5 3.5L22.5 10M11 27h10" />
              </svg>
            </span>
            <span class="service-label">Consultoria</span>
          </li>
        </ul>
        <p class="tagline">O sol quando nasce é para todos.</p>
      </section>
    </div>
  </main>

  <script>
    const form = document.getElementById("contact-form");
    const message = document.getElementById("form-message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const submitButton = form.querySelector("button[type=submit]");
      submitButton.disabled = true;
      message.textContent = "";
      message.className = "form-message";

      try {
        const response = await fetch(form.action, {
          method: "POST",
          body: new FormData(form),
          headers: { Accept: "application/json" },
        });

        if (response.ok) {
          form.reset();
          message.textContent = "Obrigado! Entraremos em contacto brevemente.";
          message.classList.add("success");
        } else {
          message.textContent = "Não foi possível enviar. Tente novamente ou contacte-nos por e-mail.";
          message.classList.add("error");
        }
      } catch {
        message.textContent = "Não foi possível enviar. Verifique a sua ligação e tente novamente.";
        message.classList.add("error");
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
